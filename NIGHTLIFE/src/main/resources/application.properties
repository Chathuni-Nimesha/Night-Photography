server.port=${SERVER_PORT:5454}

logging.level.org.springframework.security=WARN
logging.level.com.zos=INFO

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:unset-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:unset-google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.provider.google.user-name-attribute=email

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:nightlife}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

frontend.url=${FRONTEND_URL:http://localhost:3000}

spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# Local demo seed only. Default off. Set NIGHTLIFE_DEMO_DATA=true in NIGHTLIFE/.env to seed once.
nightlife.demo-data.enabled=${NIGHTLIFE_DEMO_DATA:false}
# One-shot refresh of demo media URLs for existing *@nightlife.demo accounts. Default off.
nightlife.demo-data.refresh-media=${NIGHTLIFE_DEMO_REFRESH_MEDIA:false}
